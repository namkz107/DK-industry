name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        # mongo:8 exits on the current GitHub runner kernel (SERVER-121912). 7.0 does not use that allocator.
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/dk_industry_ci
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/dk_industry_ci_test
      JWT_SECRET: ci_only_random_secret_that_is_longer_than_48_characters_123456789
      MFA_ENCRYPTION_KEY: ci_only_mfa_encryption_secret_longer_than_32_characters
      CLIENT_URL: http://localhost:3000
      FILE_STORAGE_DRIVER: local
      RUN_AUTH_INTEGRATION: '1'
      RUN_ADMIN_INTEGRATION: '1'
      RUN_CHAT_INTEGRATION: '1'
      RUN_CUSTOMER_INTEGRATION: '1'
      RUN_LEAD_INTEGRATION: '1'
      RUN_STAFF_INTEGRATION: '1'
      RUN_SUPPORT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test --prefix backend
      - run: npm run lint --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run test:preflight
      - run: npm run test:backup-security
      - run: npm run test:deployment-security
      - run: npm run build --prefix frontend
      - run: npm run scan:client-bundle
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - run: npm audit --omit=dev --prefix backend
      - run: npm audit --omit=dev --prefix frontend

  deploy_backend_production:
    name: Deploy backend production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: production-backend
      cancel-in-progress: false
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT || '22' }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      PRODUCTION_APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
      PRODUCTION_API_URL: https://api.cokhidangkhoa.com
    steps:
      - name: Validate production deployment secrets
        shell: bash
        run: |
          missing=()
          for name in PRODUCTION_HOST PRODUCTION_PORT PRODUCTION_USER PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_KNOWN_HOSTS PRODUCTION_APP_DIR; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy the verified backend commit
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$PRODUCTION_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "bash -s -- '$PRODUCTION_APP_DIR' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          app_dir=$1
          release_sha=$2
          cd "$app_dir"
          git fetch --prune origin master
          git checkout master
          git pull --ff-only origin master
          test "$(git rev-parse HEAD)" = "$release_sha"
          RELEASE_SHA="$release_sha" docker compose --env-file compose.production.env -f compose.production.yml build --pull api
          RELEASE_SHA="$release_sha" docker compose --env-file compose.production.env -f compose.production.yml up -d --force-recreate api
          REMOTE

      - name: Verify the deployed API release
        shell: bash
        run: |
          node <<'NODE'
          const expectedRelease = process.env.GITHUB_SHA
          const endpoint = `${process.env.PRODUCTION_API_URL}/api/live`
          const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))

          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(endpoint, { headers: { "cache-control": "no-cache" } })
              const body = await response.json()
              if (response.ok && body.release === expectedRelease && Number(body.apiContract) >= 2) {
                console.log(`Production API is running ${body.release} with contract ${body.apiContract}`)
                process.exit(0)
              }
              console.log(`Attempt ${attempt}: release=${body.release || "unknown"}, contract=${body.apiContract || "unknown"}`)
            } catch (error) {
              console.log(`Attempt ${attempt}: ${error.message}`)
            }
            await wait(10_000)
          }

          throw new Error(`Production API did not switch to ${expectedRelease}`)
          NODE
