services:
  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
